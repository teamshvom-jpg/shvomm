version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shvom_backend
    restart: always
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    volumes:
      - shvom-db:/app/data
      - shvom-uploads:/app/app/static/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: shvom_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  shvom-db:
  shvom-uploads:

